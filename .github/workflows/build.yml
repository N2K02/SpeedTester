name: Build APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
    types: [opened, synchronize, reopened]
  pull_request_target:
    types: [closed]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, e.g. 1.1. Leave empty to increment the latest release.'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ (github.event_name == 'pull_request' && github.event.pull_request.number) || 'main' }}
  cancel-in-progress: true

env:
  APP: SpeedTester
  BUILD_COMMIT: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.merge_commit_sha || (github.event_name == 'pull_request' && github.event.pull_request.head.sha) || github.sha }}

jobs:
  build:
    if: (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && (github.event_name != 'pull_request_target' || (github.event.pull_request.merged == true && github.event.pull_request.base.ref == 'main' && github.event.pull_request.head.repo.full_name == github.repository && !contains(github.event.pull_request.title, '[skip ci]')))
    runs-on: ubuntu-latest
    env:
      N2K02_PACKAGES_TOKEN: ${{ secrets.N2K02_PACKAGES_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.merge_commit_sha || (github.event_name == 'pull_request' && github.event.pull_request.head.sha) || github.sha }}
          fetch-depth: 0

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.8.2'

      - name: Configure APK build channel
        run: |
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            echo "BUILD_VARIANT=Release" >> "$GITHUB_ENV"
            echo "APK_INPUT=app/build/outputs/apk/release/app-release-unsigned.apk" >> "$GITHUB_ENV"
          else
            echo "BUILD_VARIANT=Release" >> "$GITHUB_ENV"
            echo "APK_INPUT=app/build/outputs/apk/release/app-release-unsigned.apk" >> "$GITHUB_ENV"
          fi

      - name: Test public version resolution
        run: bash .github/scripts/test-public-version.sh

      - name: Work out version and release notes
        env:
          REQUESTED: ${{ github.event.inputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          # Preserve the highest installed release lineage from source or public distribution.
          local_last=$(git tag -l 'v[0-9]*' | grep -E '^v[0-9]+[.][0-9]$' | sort -V | tail -1 || true)
          # Read the full public tag history instead of just the first 100 shared releases.
          public_last=$(bash .github/scripts/latest-public-version.sh speedtester)
          last=$(printf '%s\n%s\n' "$local_last" "$public_last" | sort -V | tail -1)
          if [ -n "$REQUESTED" ]; then
            echo "$REQUESTED" | grep -Eq '^[0-9]+\.[0-9]$' || { echo "::error::Version must look like 1.0"; exit 1; }
            ver="$REQUESTED"
          elif [ -z "$last" ]; then
            ver="1.0"
          else
            t=${last#v}; n=$(( ${t%.*} * 10 + ${t#*.} + 1 ))
            ver="$(( n / 10 )).$(( n % 10 ))"
          fi
          if [ "$GITHUB_EVENT_NAME" != "pull_request" ] && [ -n "$last" ]; then
            max=$(printf '%s\n%s\n' "$last" "v$ver" | sort -V | tail -1)
            if [ "$max" != "v$ver" ] || [ "$last" = "v$ver" ]; then
              echo "::error::Release v$ver must advance past $last"; exit 1
            fi
          fi
          echo "VERSION=$ver" >> "$GITHUB_ENV"
          VERSION_CODE=$(python3 .github/scripts/version_code.py "$GITHUB_REPOSITORY" "$GITHUB_RUN_NUMBER")
          echo "VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            echo "VERSION_SUFFIX=-experimental.$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"
          else
            echo "VERSION_SUFFIX=" >> "$GITHUB_ENV"
          fi
          prev=""
          if [ -n "$last" ] && git rev-parse -q --verify "refs/tags/$last" >/dev/null; then prev="$last"; fi
          [ -n "$prev" ] || prev=$(git tag -l 'build-*' | sort -V | tail -1 || true)
          if [ -n "$prev" ]; then range="$prev..HEAD"; else range="HEAD"; fi
          changes=$(git log --no-merges --pretty='- %s' $range | head -40)
          [ -n "$changes" ] || changes="- Rebuild, no code changes"
          {
            echo "## $APP $ver"
            echo "Version code: $VERSION_CODE"
            echo
            echo "### What's new"
            echo "$changes"
            echo
            echo "### Install"
            echo "Download the APK below and install it on your phone."
            echo
            echo "_Built from ${BUILD_COMMIT::7} ${prev:+· changes since $prev}_"
          } > release-notes.md
          cat release-notes.md


      - name: Resolve standardized experimental release name
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          python3 .github/scripts/experimental_naming.py --self-test
          python3 .github/scripts/experimental_naming.py "$GITHUB_REPOSITORY" "$APP" "$GITHUB_RUN_NUMBER" "$PR_NUMBER"
      - name: Compile and test
        run: gradle --no-daemon testDebugUnitTest assembleDebug assembleRelease lintDebug lintRelease -PappVersion="$VERSION" -PappVersionCode="$VERSION_CODE" -PappVersionSuffix="$VERSION_SUFFIX"

      - name: Preserve lint diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lint-diagnostics
          path: |
            app/build/reports/lint-results-*
            app/build/intermediates/lint_intermediate_text_report/**/lint-results-*.txt
          if-no-files-found: ignore

      - name: Build channel APK
        run: gradle --no-daemon assemble$BUILD_VARIANT -PappVersion="$VERSION" -PappVersionCode="$VERSION_CODE" -PappVersionSuffix="$VERSION_SUFFIX"

      - name: Sign APK using MRadio signing pipeline
        env:
          SIGNING_PASSPHRASE: ${{ secrets.SIGNING_PASSPHRASE }}
        run: |
          if [ -z "$SIGNING_PASSPHRASE" ]; then
            echo "::error title=Missing signing secret::Add the SIGNING_PASSPHRASE repository secret."
            exit 1
          fi
          K="$RUNNER_TEMP/keys"; mkdir -p "$K"; chmod 700 "$K"
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 600000 -in signing/keys.tar.enc -pass env:SIGNING_PASSPHRASE | tar -xf - -C "$K"
          BT=$(ls -d "${ANDROID_HOME:-$ANDROID_SDK_ROOT}"/build-tools/* | sort -V | tail -1)
          export RP=$(cat "$K/release.pass") OP=android
          "$BT/apksigner" rotate --out "$K/lineage" \
            --old-signer --ks "$K/old.keystore" --ks-pass env:OP --ks-key-alias androiddebugkey --key-pass env:OP \
            --new-signer --ks "$K/release.p12" --ks-pass env:RP --ks-key-alias release --key-pass env:RP
          "$BT/apksigner" sign \
            --ks "$K/old.keystore" --ks-pass env:OP --ks-key-alias androiddebugkey --key-pass env:OP \
            --next-signer --ks "$K/release.p12" --ks-pass env:RP --ks-key-alias release --key-pass env:RP \
            --lineage "$K/lineage" --rotation-min-sdk-version 28 \
            --out "${APK_NAME:-$APP-$VERSION}.apk" $APK_INPUT
          rm -rf "$K"
          "$BT/apksigner" verify --verbose --print-certs "${APK_NAME:-$APP-$VERSION}.apk" | grep -E "Signer.*(DN|SHA-256 digest)"

      - name: Upload APK (workflow artifact)
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.APP }}-${{ env.VERSION }}
          path: ${{ env.APK_NAME || format('{0}-{1}', env.APP, env.VERSION) }}.apk

      - name: Publish APK as a release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ env.VERSION }}
          target_commitish: ${{ env.BUILD_COMMIT }}
          name: ${{ env.APP }} ${{ env.VERSION }}
          body_path: release-notes.md
          files: ${{ env.APP }}-${{ env.VERSION }}.apk
          make_latest: true

      - name: Publish signed experimental APK to source PR release
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          TAG="experimental-pr-$PR_NUMBER-run-$GITHUB_RUN_NUMBER"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "${APK_NAME:-$APP-$VERSION}.apk" --repo "$GITHUB_REPOSITORY" --clobber
          else
            for attempt in 1 2 3; do
              if gh release create "$TAG" "${APK_NAME:-$APP-$VERSION}.apk" \
                --repo "$GITHUB_REPOSITORY" --target "$PR_HEAD_SHA" \
                --title "$EXPERIMENTAL_TITLE" \
                --notes-file release-notes.md --prerelease --latest=false; then
                exit 0
              fi
              if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
                gh release upload "$TAG" "${APK_NAME:-$APP-$VERSION}.apk" --repo "$GITHUB_REPOSITORY" --clobber
                exit 0
              fi
              echo "::warning::GitHub Releases request failed (attempt $attempt/3); retrying"
              sleep $((attempt * 10))
            done
            echo "::error::GitHub Releases unavailable after 3 attempts; APK remains in workflow artifacts"
            exit 1
          fi
