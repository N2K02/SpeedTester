name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. 1.1. Leave empty to increment the latest release."
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  APP: SpeedTester

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Calculate version and release notes
        env:
          REQUESTED: ${{ github.event.inputs.version }}
        run: |
          last=$(git tag -l 'v*' | grep -E '^v[0-9]+\.[0-9]$' | sort -V | tail -1 || true)
          if [ -n "$REQUESTED" ]; then
            echo "$REQUESTED" | grep -Eq '^[0-9]+\.[0-9]$' || { echo "::error::Version must look like 1.0"; exit 1; }
            ver="$REQUESTED"
          elif [ -z "$last" ]; then
            ver="1.0"
          else
            t=${last#v}; n=$(( ${t%.*} * 10 + ${t#*.} + 1 ))
            ver="$(( n / 10 )).$(( n % 10 ))"
          fi
          echo "VERSION=$ver" >> "$GITHUB_ENV"
          prev="$last"
          if [ -n "$prev" ]; then range="$prev..HEAD"; else range="HEAD"; fi
          changes=$(git log --no-merges --pretty='- %s' $range | head -40)
          [ -n "$changes" ] || changes="- Build and validation"
          {
            echo "## SpeedTester $ver"
            echo
            echo "### What's new"
            echo "$changes"
            echo
            echo "Install the APK attached below. Android will ask you to confirm installation."
            echo
            echo "_Built from ${GITHUB_SHA::7}_"
          } > release-notes.md

      - name: Configure signing
        env:
          KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Configure SIGNING_KEYSTORE_BASE64, SIGNING_KEYSTORE_PASSWORD, SIGNING_KEY_ALIAS and SIGNING_KEY_PASSWORD repository secrets."
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/signing"
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/signing/release.jks"
          echo "SIGNING_STORE_FILE=$RUNNER_TEMP/signing/release.jks" >> "$GITHUB_ENV"

      - name: Build and test
        env:
          SIGNING_KEYSTORE_PASSWORD: ${{ secrets.SIGNING_KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          gradle --no-daemon testDebugUnitTest assembleRelease \
            -PappVersion="$VERSION" \
            -PsigningStoreFile="$SIGNING_STORE_FILE" \
            -PsigningStorePassword="$SIGNING_KEYSTORE_PASSWORD" \
            -PsigningKeyAlias="$SIGNING_KEY_ALIAS" \
            -PsigningKeyPassword="$SIGNING_KEY_PASSWORD"

      - name: Verify APK signature
        run: |
          APK="app/build/outputs/apk/release/app-release.apk"
          test -f "$APK"
          BT=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          "$BT/apksigner" verify --verbose "$APK"

      - name: Prepare release APK
        run: cp app/build/outputs/apk/release/app-release.apk "SpeedTester-$VERSION.apk"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: SpeedTester-${{ env.VERSION }}
          path: SpeedTester-${{ env.VERSION }}.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          name: SpeedTester ${{ env.VERSION }}
          body_path: release-notes.md
          files: SpeedTester-${{ env.VERSION }}.apk
          make_latest: true
